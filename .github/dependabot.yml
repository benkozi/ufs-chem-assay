# Dependabot version updates: the pinned action majors (actions/checkout@v7
# ...) and the uv lock. Weekly, grouped, so a bump is one PR per ecosystem;
# conventional-commit titles so the PR-title check and semantic-release
# parse them (chore: no release).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(deps)'
