# Everything runs inside the image built from ./Dockerfile. Jobs are fresh
# VMs, so the image is "shared" via the buildx GitHub Actions cache: the
# build job warms it, later jobs rebuild as a pure cache hit and push to a
# job-local registry:2 service (the docker-container buildx driver holds
# results inside BuildKit, so a localhost push is how the job's docker
# daemon gets the image without a tarball round-trip). Nothing is ever
# pushed off-runner.
#
# Releases (semantic-release.yml, reusable): release-preview dry-runs PSR
# on every PR and on manual dispatch (the branch picker is the target);
# release runs for real on pushes to develop/main after pre-commit and
# tests are green. The bump commit PSR pushes carries the marker
# "Automatically generated by python-semantic-release" — not [ci skip] —
# and the release job (and integration.yaml) gate on that marker, so the
# bump commit still gets pre-commit + tests but never releases again.
name: ci
on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
permissions:
  contents: read
# Only PR runs cancel each other: a push run mid-release must finish, and
# the bump commit's own push then queues behind it in the same group.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (warm the gha cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  pre-commit:
    needs: build
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build image (cache hit) and push to job-local registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: localhost:5000/ufs-chem-assay:ci
          cache-from: type=gha
      - name: pre-commit (all files)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE":/repo -w /repo \
            localhost:5000/ufs-chem-assay:ci \
            sh -c 'git config --global --add safe.directory /repo \
                   && uv sync --frozen \
                   && uv run pre-commit run --all-files'
      # The PR title becomes the squash-merge subject that semantic-release
      # parses, so it must satisfy the same grammar as commit messages. The
      # title is attacker-controlled: it reaches the shell only through the
      # environment, never interpolated into script text.
      - name: PR title follows conventional commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          docker run --rm -e PR_TITLE -v "$GITHUB_WORKSPACE":/repo -w /repo \
            localhost:5000/ufs-chem-assay:ci \
            sh -c 'git config --global --add safe.directory /repo \
                   && uv sync --frozen \
                   && printf "%s\n" "$PR_TITLE" > /tmp/pr-title.txt \
                   && uv run pre-commit run conventional-pre-commit \
                        --hook-stage commit-msg \
                        --commit-msg-filename /tmp/pr-title.txt'
      # Post-merge: the squash-merge subject itself. PSR's own bump commit
      # is not conventional by design and is skipped on its marker.
      - name: Pushed commit follows conventional commits
        if: github.event_name == 'push'
        run: |
          if git log -1 --pretty=%B | grep -q "Automatically generated by python-semantic-release"; then
            echo "Skipping conventional check for the python-semantic-release bump commit."
            exit 0
          fi
          git log -1 --pretty=%B > /tmp/commit-msg.txt
          docker run --rm -v "$GITHUB_WORKSPACE":/repo -v /tmp/commit-msg.txt:/tmp/commit-msg.txt \
            -w /repo localhost:5000/ufs-chem-assay:ci \
            sh -c 'git config --global --add safe.directory /repo \
                   && uv sync --frozen \
                   && uv run pre-commit run conventional-pre-commit \
                        --hook-stage commit-msg \
                        --commit-msg-filename /tmp/commit-msg.txt'
  tests:
    needs: build
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Build image (cache hit) and push to job-local registry
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: localhost:5000/ufs-chem-assay:ci
          cache-from: type=gha
      # No ASSAY_*/CECE_* environment and no .env: the harness suite is
      # hermetic and mocks CECE_ROOT_DIR itself where needed.
      - name: harness tests
        run: |-
          docker run --rm -v "$GITHUB_WORKSPACE":/repo -w /repo \
            localhost:5000/ufs-chem-assay:ci \
            sh -c 'git config --global --add safe.directory /repo \
                   && uv sync --frozen \
                   && uv run pytest src/tests/ufs_chem_assay'
  # Informational, early: what PSR would do if this PR merged (merge
  # commit and squash projections in the job summary). Fork PRs run it
  # with the read-only token and no secrets.
  release-preview:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: true
      target_branch: ${{ github.base_ref || github.ref_name }}
      pr_title: ${{ github.event.pull_request.title || '' }}
    secrets: inherit
  # The real thing: only this repository, only pushes, never the bump
  # commit itself, and only after the branch is green.
  release:
    if: >-
      github.repository == 'benkozi/ufs-chem-assay' &&
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release')
    needs:
      - pre-commit
      - tests
    permissions:
      contents: write
    uses: ./.github/workflows/semantic-release.yml
    with:
      dry_run: false
      target_branch: ${{ github.ref_name }}
    secrets: inherit
