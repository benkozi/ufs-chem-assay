# CodeQL code scanning (https://codeql.github.com/): the harness's Python
# and the workflows themselves (the `actions` language), on every PR, every
# push to develop/main, and weekly so a new query pack reaches an unchanged
# branch. Findings land under Security > Code scanning; a PR run annotates
# the diff. Python needs no build. Nothing here touches the toolchain image
# or S3. The repository is public, so code scanning costs nothing.
name: codeql
on:
  pull_request:
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: 17 6 * * 1
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    # The semantic-release bump commit changes pyproject.toml, uv.lock, and
    # the changelog only: nothing to scan (same gate as release-psr).
    if: ${{ !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload the SARIF results
      actions: read  # the `actions` language reads workflow run metadata
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality: the default security queries plus the
          # maintainability/reliability set; ruff and mypy cover style.
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
