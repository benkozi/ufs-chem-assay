# Integration: the real simple-maccity suite against CECE (repo/ref in env) —
# clone CECE (submodules), build its image (gha buildx cache, loaded into the
# host daemon as cece/cece-dev), restore build/ from the cache keyed by CECE
# SHA and compile the driver in the container ONLY on a miss (an exact hit
# already holds the driver; re-running the build on a hit recompiled every
# CECE object because the fresh checkout's mtimes postdate the restored
# objects — 2m41s of a 4-minute job), stage the suite's declared inputs with
# the harness's own `fetch` (public bucket, anonymous), then run the harness
# on the host (docker-in-docker avoided) and upload the whole output root.
#
# The push trigger exists to create develop-scoped caches PR runs can
# restore — a pull_request-only workflow never shares caches across PRs.
# A CECE SHA unused for 7 days is evicted and rebuilds cold once; a new SHA
# restores the `cece-build-` prefix fallback, which skips configure and the
# FetchContent clones under build/_deps but recompiles every object (the
# fresh checkout's mtimes postdate the restored ones) — about 3m20s.
#
# The save needs the tree readable by the runner: the container builds as
# root, and CECE's build leaves pip's HTTP cache under build/python/cache
# at mode 0600, which the save's tar (runner user) cannot open.
# actions/cache/save turns that into a warning and a green step, so from
# 2026-10-08 (the move to CECE develop, whose build creates that cache) to
# 2026-10-16 no save succeeded and every run rebuilt the driver. The tree
# is re-owned to the runner before the save, and a verification step goes
# red (non-fatal) if the key is still absent afterwards (see
# design/fix/20261016-0813-integration-cache-save/).
#
# Baselines are OFF (ASSAY_ENABLE_BASELINE_COMPARISONS=false): the store is
# the private s3://ufs-chem/baselines prefix (ufs-chem-assay publish-baselines)
# and this job has no AWS credentials. TODO: OIDC credentials + the download
# half, then re-enable (see design/feat/20261008-1433-baseline-sync/).
#
# The job is allowed to fail (continue-on-error): the long end-to-end run
# must never block PRs to develop. Check the job's own status — a red
# simple-maccity is a real finding even when the workflow reports green.
#
# python-semantic-release's bump commit (pushed by the release job with the
# App token, so it does trigger workflows) is skipped on its marker: a
# version bump changes nothing CECE-side. Only PR runs cancel each other:
# a push to develop queues behind the in-progress run instead, so the bump
# push about a minute after a merge no longer cancels the merge commit's
# run (which would leave develop with no integration result, since the
# bump's own run is the one skipped above).
name: integration
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop
permissions:
  contents: read
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Upstream develop: it carries the build script's --target/--jobs the build
# step needs (ufs-community/CECE#154, merged 2026-10-08).
env:
  CECE_REPOSITORY: ufs-community/CECE
  CECE_REF: develop
jobs:
  simple-maccity:
    # head_commit is absent on pull_request events: contains(null, …) is
    # false, so PR runs are unaffected.
    if: ${{ !contains(github.event.head_commit.message, 'Automatically generated by python-semantic-release') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The save-verification step lists the repository's caches.
      actions: read
    # Allowed to fail: the e2e run never blocks merges (see header note).
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check out CECE (nested submodules)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CECE_REPOSITORY }}
          ref: ${{ env.CECE_REF }}
          path: cece
          submodules: recursive
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build the CECE image (gha cache) and load it as cece/cece-dev
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: cece
          load: true
          tags: cece/cece-dev
          cache-from: type=gha,scope=cece-image
          cache-to: type=gha,mode=max,scope=cece-image
      - name: Resolve the CECE commit
        id: cece
        run: echo "sha=$(git -C cece rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Restore/save are split: the build runs only when the exact key missed
      # (a hit holds the driver already), and the save runs only after a
      # successful build so a partial tree never lands under the exact key
      # — where it would skip the build forever for that SHA. A new SHA
      # restores the prefix fallback and builds incrementally.
      - name: Restore the CECE build directory
        id: restore-build
        uses: actions/cache/restore@v6
        with:
          path: cece/build
          key: cece-build-${{ steps.cece.outputs.sha }}
          restore-keys: |
            cece-build-
      # The cache round-trip re-owns the tree to the runner user, but the
      # container builds as root — and the FetchContent git clones under
      # build/_deps then trip git's safe.directory check ("dubious
      # ownership": repo owner != git's uid), killing the configure re-run.
      # Hand the restored tree back to root, matching the cold-build state.
      - name: Re-own the restored build tree for the container
        run: |
          if [ -d cece/build ]; then sudo chown -R 0:0 cece/build; fi
      # CECE's own entrypoint: configure-if-no-cache + cmake --build in the
      # already-loaded image (it never builds an image; ESMF stays off via
      # the Dockerfile's BUILD_ESMF=OFF default). Only the driver target —
      # googletest/gmock and the test stack are not in its dependency graph
      # — at bounded parallelism (bare -j thrashes a 4-vCPU/16 GB runner).
      - name: Build CECE in the container
        id: build
        if: steps.restore-build.outputs.cache-hit != 'true'
        run: >-
          python3 cece/scripts/build-and-test-container.py --no-test
          --target cece_standalone_driver --jobs 4
      # The container built as root; the save's tar runs as the runner user
      # (see the header note: root-only files under build/python/cache made
      # every save fail silently). Hand the tree back before saving; the
      # restore side gives it to root again, above.
      - name: Re-own the built tree for the cache save
        if: always() && steps.restore-build.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        run: sudo chown -R "$(id -u):$(id -g)" cece/build
      - name: Save the CECE build directory
        if: always() && steps.restore-build.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: cece/build
          key: cece-build-${{ steps.cece.outputs.sha }}
      # A failed save is only a warning in actions/cache/save: assert the key
      # exists. Red but non-fatal (step-level continue-on-error): a cache
      # problem must not hide the suite result below. --key is a prefix
      # match, hence the exact filter.
      - name: Verify the build cache was saved
        if: always() && steps.restore-build.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: cece-build-${{ steps.cece.outputs.sha }}
        run: |
          caches=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "$KEY" --json key)
          found=$(printf '%s' "$caches" | jq "map(select(.key == \"$KEY\")) | length")
          if [ "$found" -eq 0 ]; then
            echo "::error::cache $KEY was not saved -- see the warning in the save step"
            exit 1
          fi
      # The uv cache (wheels, the built cartopy) keyed on the lock file alone,
      # so a comment edit in pyproject.toml does not invalidate it.
      - name: Install uv (interpreter matches the runner Dockerfile)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
      # The suite declares its inputs (the one MACCity file, from a public
      # bucket: anonymous, no credentials); fetch verifies by digest.
      - name: Stage the suite's inputs
        env:
          CECE_ROOT_DIR: ${{ github.workspace }}/cece
          # fetch would otherwise also stage the pinned baselines from the
          # private store (no credentials here).
          ASSAY_ENABLE_BASELINE_COMPARISONS: 'false'
        run: |
          uv sync --frozen
          uv run ufs-chem-assay fetch --suite-config=simple-maccity-suite.yaml
      - name: Run simple-maccity-suite.yaml
        env:
          CECE_ROOT_DIR: ${{ github.workspace }}/cece
          # Baselines stay off: no credentials for the private store here
          # (see the header note).
          ASSAY_ENABLE_BASELINE_COMPARISONS: 'false'
        run: |
          uv run pytest src/tests/test_driver_combos.py \
            --suite-config=simple-maccity-suite.yaml \
            --combo-output-root=ufs-chem-assay-ci-output
      # Success and failure alike: run.yaml (with application_commit), combos.csv,
      # test-report.csv, stats, plots, NetCDF, .out, cece.log per combo.
      - name: Upload the output root
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: simple-maccity-output-${{ github.run_id }}-${{ github.run_attempt }}
          path: cece/ufs-chem-assay-ci-output
