# Daily proof that python-semantic-release can still push: the two App
# secrets exist and are well-formed, the minted App token sees this
# repository and can create/delete a ref on it, and every ruleset that
# requires pull requests lists the App as an always-bypass actor (a
# warning otherwise — that is the one thing that makes a real release
# fail at its final push). Never on forks. contents: read is enough: the
# write probe goes through the App token, which is the credential under
# test. GitHub pauses schedules after 60 days without activity; dispatch
# by hand to re-check at any time.
name: verify-secrets
on:
  schedule:
    - cron: 0 6 * * *
  workflow_dispatch:
concurrency:
  group: verify-secrets
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify-semantic-release-credentials:
    name: Verify Semantic Release Credentials
    if: github.repository == 'benkozi/ufs-chem-assay'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate secrets presence and format
        env:
          SEMVER_APP_ID: ${{ secrets.SEMVER_APP_ID }}
          SEMVER_APP_PRIVATE_KEY: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
        run: python3 .github/workflows/scripts/verify_semantic_release_credentials.py check-secrets
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SEMVER_APP_ID }}
          private-key: ${{ secrets.SEMVER_APP_PRIVATE_KEY }}
      - name: Verify repository write and ruleset bypass
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          APP_ID: ${{ secrets.SEMVER_APP_ID }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |-
          python3 .github/workflows/scripts/verify_semantic_release_credentials.py check-permissions \
            --branches develop main
