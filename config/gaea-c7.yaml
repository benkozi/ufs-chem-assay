# Run config for Gaea C7 (RDHPCS): build and test CECE against the spack-stack 2.2.0 environment the way the UFS
# builds there — the harness's own UFS modulefile (modulefiles/ufs_gaeac7.oneapi.lua) on top of the environment's
# modules/Core. One toolchain, one application: what has been built and tested on C7. The standard run:
#   ufs-chem-assay run --config-file=config/gaea-c7.yaml --application cece \
#     --stage source --stage build --stage test [--dry-run]
#   ufs-chem-assay watch --only tests  # evaluates the test job when it leaves the queue
#   ufs-chem-assay report --only tests
# The build is under <root_dir>/oneapi/ (checkout, build directory, tests root); its scripts are
# <root_dir>/scripts/<NN>-<stage>-cece-oneapi.sh. Single-node jobs are moved to the batch-shared partition by the
# scheduler ("Single node Jobs are redirected"): the compile steps and the test job are one node each, so that
# message is expected.
# The environment provides Kokkos, kokkos-kernels, ArborX and yaml-cpp (kokkos/5.1.1, kokkos-kernels/5.1.1,
# arborx/2.1, yaml-cpp/0.8.0), and the gates require CECE to take them rather than fetch or bundle its own. The
# build is the offline compile probe: configure and compile as two srun steps on a compute node with the test
# stack off (a compute node has no network), then a login-node finish that builds the test stack. To build on the
# login node alone, add --override applications:cece:build_node=login. CATChem and the harness's Kokkos smoke
# project are not in this file yet (config/ursa-kokkos.yaml has them).
# Keys not listed keep their defaults (config/ursa.yaml lists every key); command-line overrides change any of
# them: --override applications:cece:update_source=true slurm:qos=debug
platform: gaea-c7  # optional: detected from the hostname (gaea7N) when absent; --platform wins
# root_dir is derived: the parent of this harness checkout. Set it here, or pass --root-dir, only if your layout
# differs.
# toolchains: one entry per compiler suite, overlaid on every application section below. Under this map an
# application section may not set modulefile, modulepath, module_env, toolchain_tools or clone_dir itself.
toolchains:
  oneapi:
    modulefile: ufs_gaeac7.oneapi  # modulefiles/ufs_gaeac7.oneapi.lua: the weather model's C7 file
    modulepath:
      - modulefiles  # relative: this harness checkout's modulefiles/
      - /ncrc/proj/epic/spack-stack/c7/spack-stack-2.2.0/envs/ue-oneapi-2025.3.1/modules/Core  # the environment
    module_env:  # exported before the load
      esmf_ver: 9.0.0b17  # what the environment's UFS stack is built with; its default esmf is a later beta
      mapl_ver: 2.69.1-esmf-9.0.0b17  # the mapl built against that esmf
    toolchain_tools:  # located with `which` after the load: Intel's own compilers, C7 has no Cray wrappers
      - icx
      - icpx
      - ifx
      - cmake
      - ctest
    cmake_args:  # appended to every application's configure arguments
      - -DCMAKE_CXX_FLAGS=-fp-model=precise  # IntelLLVM: value-safe floating point, which CECE's axis tests need
    mpi_launcher: srun  # cray-mpich: every MPI test is its own `srun -n <ranks>` step of the test job
    mpiexec_preflags:  # none needed
    tests_env: {}  # merged into every application's tests.env; none needed
    configure_gates: []  # added to every application's own: only what every application's configure prints
applications:  # one section per application in the run, keyed by adapter name
  cece:
    # The branch that builds against ESMF 9: develop plus a fix to cmake/FindESMF.cmake (ESMF 9's own CMake
    # package hands the Fortran driver's -cxxlib to icpx). TODO(gaea-c7): back to ufs-community/CECE at develop
    # once that fix is merged there.
    git_url: git@github.com:benkozi/CECE.git
    ref: feature/multi-tile-host-decomp
    update_source: false  # true: fetch, checkout ref, pull --ff-only, submodule update --init --recursive
    cmake_args:  # CECE's unit tests are built against a Debug build with ESMF: tests.enabled requires both
      - -DCMAKE_BUILD_TYPE=Debug
      - -DENABLE_ESMF=ON
    build_jobs: 8
    targets:  # `all` includes the test stack, which tests.enabled requires
      - all
    configure_gates:  # with ESMF on, the adapter already requires `CECE dependency ESMF: system`
      - 'CECE dependency Kokkos: system'  # the environment's Kokkos, not a fetched one
      - 'CECE dependency yaml-cpp: system'  # the environment's yaml-cpp, not the extern/yaml-cpp submodule
      - 'AXIS: ArborX .* found via find_package'  # the environment's ArborX; only CECE (HELM's AXIS) prints it
    build_node: compute  # the offline compile probe (two srun steps), then a login-node finish with the test stack
    build_minutes: 10  # each compile step's time limit
    tests:  # ctest, one Slurm job: ctest on the node, each MPI test launching its own ranks
      enabled: true
      filter:  # ctest -R regex; null = every test
      parallel:  # ctest -j N; null = one at a time
      ntasks: 4  # the largest MPI rank count a test asks for
      cpus: 8
      minutes: 15
      env:
        PIP_NO_INDEX: '1'  # no network on a compute node: CECE's pip fixtures return at once instead of retrying
slurm:  # the account, QOS and partition of the test job
  account: epic
  qos: normal
  partition: batch
  queue_wait_s: 3600  # queue allowance for the test job before the harness cancels it
  poll_s: 30
  extra_args: --clusters=c7  # Gaea is several clusters behind one scheduler: every job names its own
uv:
  cache_dir:  # UV_CACHE_DIR; default <root_dir>/uv-cache
