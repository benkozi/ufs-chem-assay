# Run config for Ursa (RDHPCS): native driver build against the application's
# own modulefiles; pytest on the login node submitting every driver call as a
# Slurm job at once, then polling (the slurm runtime). Two sessions ship
# enabled — simple-maccity (the base sections as written) and gcafs-anthro
# (its own suite, timeout cap and job geometry) — each its own pytest session
# under <output_root>/<session>; a commented exhaustive-maccity entry shows
# how to add one. From a runbook-layout checkout:
#   ufs-chem-assay run --config-file=config/ursa.yaml [--dry-run] [--session NAME]...
#   ufs-chem-assay watch  # evaluates each session when its jobs are done
# Every stage renders to <root_dir>/scripts/<NN>-<stage>-<application>[-<session>].sh
# and runs with bash where the CLI runs; with harness.submit_only the harness
# stage returns after submitting and 06-resume-* finishes the session later.
# Every key is listed; command-line overrides change any of them:
#   --override slurm:qos=batch sessions:gcafs-anthro:slurm:ntasks=4
platform: ursa  # optional: detected from the hostname when absent; --platform wins
# root_dir is derived: the parent of this harness checkout ($ROOT/ufs-chem-assay beside $ROOT/CECE).
# Set it here, or pass --root-dir, only if your layout differs.
applications:  # one section per application in the run, keyed by adapter name
  cece:
    git_url: git@github.com:ufs-community/CECE.git
    ref: develop
    clone_dir:  # default <root_dir>/CECE; an existing checkout is used as-is
    update_source: false  # true: fetch, checkout ref, pull --ff-only, submodule update --init --recursive
    modulefile: cece_ursa.intelllvm  # CECE_MODULEFILE: from <clone>/modulefiles after `module purge`
    docker_image:  # CECE_DOCKER_IMAGE; unused under slurm
    driver_path:  # CECE_DRIVER_PATH; null = the adapter's default (./build/cece_standalone_driver)
    cmake_args:
      - -DCMAKE_BUILD_TYPE=Release
    build_jobs: 8
    targets:  # `all` also builds CECE's test stack (running it: issue #9)
      - cece_standalone_driver
data:  # the data stage runs `ufs-chem-assay fetch` for the selected suites' inputs, then:
  warm_cartopy: true  # fetch Natural Earth coastlines on the login node
  input_search_path: []  # ASSAY_INPUT_SEARCH_PATH: dirs fetch links url-null inputs from, by basename
baselines:
  root_dir:  # ASSAY_BASELINE_ROOT_DIR
  enabled: false  # ASSAY_ENABLE_BASELINE_COMPARISONS; no public store yet
  store: s3://ufs-chem/baselines  # ASSAY_BASELINE_STORE: an s3://bucket/prefix or a local directory
outputs:
  store: s3://ufs-chem/assay-output  # ASSAY_OUTPUT_STORE: an s3://bucket/prefix or a local directory
harness:
  suite_config: simple-maccity-suite.yaml  # regex over *-suite.yaml names; every match runs
  output_root: ufs-chem-assay-output  # relative: under the checkout; absolute: anywhere writable
  clean_root: true  # removes only a previous harness root (one with run.yaml)
  pytest_dry_run: false  # pytest --dry-run: generate everything, execute no driver
  pytest_args: []  # e.g. [-x, -k, map-consd]
  publish_baselines: false  # pytest --publish-baselines: publish passing compared combos at session end
  no_suite_update: false  # pytest --no-suite-update: publish without repointing the suite files
  record_benchmarks: true  # pytest --record-benchmarks: append the run's rows to the suites' benchmarks.csv; commit
  upload_output: false  # pytest --upload-output: copy the whole output root to outputs.store/<run ULID> at session end
  submit_only: true  # pytest --submit-only: submit every job, write jobs.yaml, stop; `watch` evaluates (slurm only)
  runtime:  # ASSAY_RUNTIME; null = the platform's default (slurm here)
  launcher: ''  # ASSAY_LAUNCHER; ignored under slurm
  env:  # exported inside every driver job (ASSAY_JOB_ENV); the single-node MPI hints CECE's ctest uses
    I_MPI_FABRICS: shm
    FI_PROVIDER: tcp
  dask_nworkers: 2  # analysis runs in the pytest process on the login node: stay small
  run_timeout_s: 300
  log_level:  # ASSAY_LOG_LEVEL; null = INFO
  config_search_path:  # ASSAY_CONFIG_SEARCH_PATH
  suite_config_search_path: []  # ASSAY_SUITE_CONFIG_SEARCH_PATH
slurm:  # the per-driver job (ASSAY_SBATCH_ARGS); time limit = the suite timeout
  account: epic  # sbatch -A; the default when omitted
  qos: debug  # 30 min cap per job; `batch` (8 h) for long drivers
  queue_wait_s: 3600  # queue allowance per job before the harness cancels it; hours on `batch`
  poll_s: 30  # ASSAY_SLURM_POLL_S: seconds between squeue polls while a job is queued or running
  partition: u1-compute
  ntasks: 1  # sbatch -n and srun --ntasks: MPI tasks per driver job (the driver splits latitude bands across them)
  cpus: 8  # sbatch -c: cores per task; the driver uses them all as threads unless env says otherwise
  srun_args: ''  # extra srun options for the driver launch, e.g. --cpu-bind=cores
  extra_args: ''  # extra sbatch directives, verbatim, e.g. --mem=0
# sessions: one pytest session per entry, each under <output_root>/<session>; an entry overlays the harness:,
# slurm: and baselines: sections above, one level deep (an overlaid key replaces the base value whole).
# --session NAME selects an entry; --override sessions:<name>:<section>:<key>=<value> reaches one.
sessions:
  simple-maccity: {}  # the base sections as written: simple-maccity-suite.yaml, 8 cores, debug
  # exhaustive-maccity:  # a further session, documented but not enabled: uncomment to run both exhaustive suites
  #   harness:
  #     suite_config: exhaustive-maccity-.*-suite.yaml  # both exhaustive suites, one session
  #   slurm:
  #     qos: batch  # 8 h; the debug QOS is 30 min
  #     queue_wait_s: 14400  # batch waits can be hours, and every job is submitted at once
  gcafs-anthro:  # the global anthropogenic use case (docs/gcafs-anthro-runbook.md); input paths are in the suite
    harness:
      suite_config: gcafs-anthro-suite.yaml
      run_timeout_s: 28800  # the batch cap: the suite's own timeout_s (1800 = --time=30 for now) is the job limit
      env:  # replaces harness.env whole: the MPI hints again, then the author's single-thread geometry
        I_MPI_FABRICS: shm
        FI_PROVIDER: tcp
        OMP_NUM_THREADS: 1
        OMP_PROC_BIND: spread
        OMP_PLACES: threads
        KOKKOS_NUM_THREADS: 1
        MKL_NUM_THREADS: 1
        OPENBLAS_NUM_THREADS: 1
        OPENBLAS_DEFAULT_NUM_THREADS: 1
    slurm:
      cpus: 1  # one core per task … (the rank-invariance check: --override sessions:gcafs-anthro:slurm:ntasks=4)
      srun_args: --cpu-bind=cores  # … bound
      extra_args: --mem=0  # the whole node's memory: the per-core default was not enough
uv:
  cache_dir:  # UV_CACHE_DIR; default <root_dir>/uv-cache
