[project]
name = "ufs-chem-assay"
version = "0.1.0-rc.2"
description = "UFS-Chem testing, verification, and benchmarking harness: a combinatorial pytest suite for UFS-Chem application drivers (CECE today), behind one adapter per application"
requires-python = ">=3.11"
dependencies = [
    "cartopy>=0.22",
    "dask[distributed]>=2024.1",
    "jinja2>=3.1",
    "matplotlib>=3.8",
    "netcdf4>=1.6",
    "pandas>=2.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "python-ulid>=2.0",
    "pyyaml>=6.0",
    "xarray>=2024.1",
]

[project.scripts]
# The orchestration entrypoint (src/cli); pytest stays the test entry point.
ufs-chem-assay = "cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ is remapped to the package root so `models`, `combos`, `cli`, ...
# import exactly as they do under pytest's pythonpath = ["src"]; the tests
# stay out of the wheel.
only-include = ["src"]
exclude = ["src/tests"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pandas-stubs>=2.0",
    "pre-commit>=4.0",
    # The 0.12 family the codebase is formatted with; keeps `uv run ruff`
    # resolving from the lock instead of whatever is on a machine's PATH.
    "ruff>=0.12,<0.13",
    "types-pyyaml>=6.0",
    "yamlfix>=1.16",
    "yamllint>=1.35",
]

[tool.uv]
# Installed (editable) for the `ufs-chem-assay` console script; the CI
# image syncs with --no-install-project since it carries no source.
package = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
# The CI helper scripts (.github/workflows/scripts) import by module name
# in the harness suite.
pythonpath = ["src", ".github/workflows/scripts"]
# data_integration tests talk to the real private test bucket
# (arn:aws:s3:::ufs-chem; credentials via the aws CLI's own chain); skipped (deselected)
# unless asked for -- a command-line -m replaces this one:
#   uv run pytest -m data_integration src/tests/ufs_chem_assay/test_s3_sync.py
addopts = ["--strict-markers", "-m", "not data_integration"]
markers = [
    "data_integration: live S3 round trip against the private test bucket s3://ufs-chem (needs the aws CLI and credentials it can find on its own: credentials file, profile, environment, SSO); deselected by default",
]

[tool.mypy]
files = ["src", ".github/workflows/scripts"]
mypy_path = "src"
explicit_package_bases = true
# python_version deliberately unpinned: checking runs against the venv's
# interpreter (3.14); dependency stubs (numpy) need >=3.12 syntax.
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# cartopy ships no stubs and no py.typed marker; the only untyped library.
module = "cartopy.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.yamlfix]
# Minimize churn on checked-in suite/driver configs: no forced document
# start, keep block-style sequences. Kept coherent with .yamllint.yaml.
explicit_start = false
sequence_style = "block_style"
line_length = 120

# Releases run from CI (ci.yaml -> semantic-release.yml) on every push to
# develop (X.Y.Z-rc.N) and main (X.Y.Z): version-bump commit + tag +
# CHANGELOG.md, nothing published. The bump commit carries the marker
# below and NOT [ci skip]: workflows gate on the marker themselves (see
# ci.yaml / integration.yaml), so the bump commit still gets pre-commit
# and tests. build_command keeps uv.lock's recorded project version in
# step with pyproject.toml (packaged project). PSR itself is not a
# dependency -- the GHA action runs it; preview locally via
#   uv tool run --from 'python-semantic-release>=10,<11' semantic-release --noop version
[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = []
build_command = """
pip install uv
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
"""
allow_zero_version = true
# Pre-1.0: a breaking change bumps minor (0.1 -> 0.2), not to 1.0.0.
major_on_zero = false
commit_message = "{version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.commit_parser_options]
# Parse only the squash-merge subject (the PR title). PSR v10 defaults this to
# true and would otherwise turn every conventional-looking bullet in a squash
# body into its own changelog entry and version-bump candidate.
parse_squash_commits = false

[tool.semantic_release.changelog]
exclude_commit_patterns = [".*\\n\\nAutomatically\\ generated\\ by\\ python\\-semantic\\-release.*$"]

[tool.semantic_release.branches.main]
match = "(^main$)"
prerelease = false

[tool.semantic_release.branches.develop]
match = "(^develop$)"
prerelease = true
prerelease_token = "rc"
