[project]
name = "ufs-chem-assay"
version = "0.1.0"
description = "UFS-Chem testing, verification, and benchmarking harness: a combinatorial pytest suite for cece_standalone_driver"
requires-python = ">=3.11"
dependencies = [
    "cartopy>=0.22",
    "dask[distributed]>=2024.1",
    "matplotlib>=3.8",
    "netcdf4>=1.6",
    "pandas>=2.0",
    "pillow>=10.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pytest>=8.0",
    "pytest-mock>=3.0",
    "python-ulid>=2.0",
    "pyyaml>=6.0",
    "xarray>=2024.1",
]

[project.scripts]
# The orchestration entrypoint (src/cli); pytest stays the test entry point.
ufs-chem-assay = "cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# src/ is remapped to the package root so `models`, `combos`, `cli`, ...
# import exactly as they do under pytest's pythonpath = ["src"]; the tests
# stay out of the wheel.
only-include = ["src"]
exclude = ["src/tests"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pandas-stubs>=2.0",
    "pre-commit>=4.0",
    # The 0.12 family the codebase is formatted with; keeps `uv run ruff`
    # resolving from the lock instead of whatever is on a machine's PATH.
    "ruff>=0.12,<0.13",
    "types-pyyaml>=6.0",
    "yamlfix>=1.16",
    "yamllint>=1.35",
]

[tool.uv]
# Installed (editable) for the `ufs-chem-assay` console script; the CI
# image syncs with --no-install-project since it carries no source.
package = true

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
# python_version deliberately unpinned: checking runs against the venv's
# interpreter (3.14); dependency stubs (numpy) need >=3.12 syntax.
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
# cartopy ships no stubs and no py.typed marker; the only untyped library.
module = "cartopy.*"
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true

[tool.yamlfix]
# Minimize churn on checked-in suite/driver configs: no forced document
# start, keep block-style sequences. Kept coherent with .yamllint.yaml.
explicit_start = false
sequence_style = "block_style"
line_length = 120

# Releases are manual-only (workflow_dispatch of semantic-release.yml):
# version-bump commit + tag + changelog, nothing published anywhere. The
# [ci skip] in commit_message keeps bump commits from triggering CI and,
# via exclude_commit_patterns, out of the changelog. No build_command:
# nothing is published, so the wheel is never built by a release. PSR itself is not a
# dependency — the GHA action runs it; preview locally via
#   uv tool run --from 'python-semantic-release>=10,<11' semantic-release --noop version
[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]
version_variables = []
build_command = ""
allow_zero_version = true
commit_message = "{version}\n\nAutomatically generated by python-semantic-release [ci skip]"

[tool.semantic_release.changelog]
exclude_commit_patterns = [".*\\n\\nAutomatically\\ generated\\ by\\ python\\-semantic\\-release\\ \\[ci\\ skip\\]$"]

[tool.semantic_release.branches.main]
match = "(^main$)"
prerelease = false

[tool.semantic_release.branches.develop]
match = "(^develop$)"
prerelease = true
