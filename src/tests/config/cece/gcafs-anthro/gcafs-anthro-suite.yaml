# The global anthropogenic use case (issue 33): one configuration, no sweep —
# the base config is the single combination. Ursa only: the inputs are not in
# any bucket and the run takes hours; run it through config/ursa.yaml with the
# override list in docs/gcafs-anthro-runbook.md (the batch QOS, the raised
# timeout cap, the author's single-task single-thread geometry).
name: gcafs-anthro
config_path: gcafs-anthro.yaml
timeout_s: 1800  # per combination; deliberately short (the author saw up to 3 h): see it time out, then raise
# Inputs the base config reads, expected at <CECE_ROOT_DIR>/data/gcafs-anthro/.
# No remote source yet (url: null): the files are copied there from the
# existing staging area on Ursa, and `uv run ufs-chem-assay fetch
# --suite-config=gcafs-anthro-suite.yaml` verifies each by sha256 and names any
# that is missing — it never downloads these. On Ursa each entry's `sources`
# names the file's known location (the author's staging area) and fetch links
# it from there; elsewhere ASSAY_INPUT_SEARCH_PATH is searched by basename.
# Filling in the url lines (after a one-time upload) makes them fetchable; the
# digests stay.
# The all-zero digests are placeholders: replace them with `sha256sum` of the
# placed files (runbook step 5) before the first run — until then fetch fails
# naming each file, which is the point.
# The Ursa source paths below exceed the line limit:
# yamllint disable rule:line-length
