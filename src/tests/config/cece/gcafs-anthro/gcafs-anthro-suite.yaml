# yamllint enable rule:line-length
# assertions: defaults — file count derived from the config (25), filenames
# from the pattern, every output variable on (time, lev, lat, lon). The species
# attribute dictionaries are pinned after the first run writes them.
analysis:
  compute_descriptive_stats: true
plotting:
  enabled: true
  gif_enabled: true
  scale: log  # the default: SO2/OC/BC span many decades; zeros (ocean) grey
  decades: 5  # the floor five decades below the suite-wide maximum
  bias_scale: linear  # the default
# One entry: the empty selector matches the single combination of a sweep-less
# suite. The ULID is the baseline published from Ursa on 2026-10-22
# (publish-baselines repoints this line on every publish); rtol as for
# maccity: a few float64 ULPs at any magnitude.
baseline_comparisons:
  - sweep_selector: {}
    ulid: 01M5JV8MBW0XE9TPE0BDCGSFJZ
    rtol: 1.0e-15
