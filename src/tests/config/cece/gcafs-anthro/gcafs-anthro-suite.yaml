# yamllint enable rule:line-length
# assertions: defaults — file count derived from the config (25), filenames
# from the pattern, every output variable on (time, lev, lat, lon). The species
# attribute dictionaries are pinned after the first run writes them.
analysis:
  compute_descriptive_stats: true
plotting:
  enabled: true
  gif_enabled: true
# One entry: the empty selector matches the single combination of a sweep-less
# suite. The all-zero ULID is the bootstrap placeholder — no baseline is in the
# store yet; run with comparisons off, publish-baselines, and the repoint
# replaces it. rtol as for maccity: a few float64 ULPs at any magnitude.
baseline_comparisons:
  - sweep_selector: {}
    ulid: '00000000000000000000000000'
    rtol: 1.0e-15
