      scale_fields:
        - EDGAR_TODNOX
    - field: BC_rco
      operation: add
      scale: 1.0
      scale_fields:
        - CAMS_DAILY_RES
        - CAMS_HOURLY_RES_PM10_PM25
    - field: BC_tra
      operation: add
      scale: 1.0
      scale_fields:
        - CAMS_WEEKLY_TRO
        - CAMS_HOURLY_TRO_WEEKDAY
    - field: BC_sol
      operation: add
      scale: 1.0
      scale_fields:
        - EDGAR_TODNOX
    - field: BC_was
      operation: add
      scale: 1.0
      scale_fields:
        - EDGAR_TODNOX
  BC_elev:
    - field: BC_ene
      operation: add
      scale: 1.0
      scale_fields:
        - CAMS_WEEKLY_ENE_PM25
        - CAMS_HOURLY_ENE_PM25
  BC_ship:
    - field: BC_shp
      operation: add
      scale: 1.0
      scale_fields:
