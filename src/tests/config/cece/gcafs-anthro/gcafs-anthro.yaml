# The global anthropogenic use case (issue 33): @zmoon's cece_config_v5.yml,
# carried 2026-10-19 with the seven input paths made cwd-relative
# (data/gcafs-anthro/<basename>; the driver runs in the checkout) and two
# driver keys dropped that CECE develop does not read at this level
# (amio_read_timeout_s, amio_staging_timeout_ms — see the model's comment).
# 0.25-degree global grid, 25 hourly steps from 2021-12-20T11 (crossing a day
# boundary: the daily, weekly, and hourly cadences all turn over), 10 species
# over 32 streams and 7 files, SO2/OC/BC written every step. The author's note
# on the EDGAR_TODNOX stream stands: investigate mapalgo bilinear, since the
# file is coarse (a candidate sweep, not a change here).
driver:
  start_time: '2021-12-20T11:00:00'
  end_time: '2021-12-21T12:00:00'
  timestep_seconds: 3600
  amio_staging_buffer_count: 32
  amio_staging_buffer_capacity_bytes: 67108864
  amio_prefetch_depth: 1
  grid:
    nx: 1440
    ny: 720
    nz: 1
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0
species:
  SO2:
    - field: SO2_agr
      operation: add
      scale: 1.0
      scale_fields:
        - EDGAR_TODNOX
    - field: SO2_ind
      operation: add
      scale: 1.0
      scale_fields:
        - EDGAR_TODNOX
    - field: SO2_rco
      operation: add
      scale: 1.0
      scale_fields:
        - CAMS_DAILY_RES
        - CAMS_HOURLY_RES_PM10_PM25
    - field: SO2_tra
      operation: add
      scale: 1.0
      scale_fields:
        - CAMS_WEEKLY_TRO
        - CAMS_HOURLY_TRO_WEEKDAY
    - field: SO2_sol
      operation: add
      scale: 1.0
      scale_fields:
        - EDGAR_TODNOX
    - field: SO2_was
      operation: add
      scale: 1.0
      scale_fields:
        - EDGAR_TODNOX
  SO2_elev:
    - field: SO2_ene
      operation: add
      scale: 1.0
      scale_fields:
        - CAMS_WEEKLY_ENE_PM25
        - CAMS_HOURLY_ENE_PM25
  SO2_ship:
    - field: SO2_shp
      operation: add
      scale: 1.0
      scale_fields:
        - EDGAR_TODNOX
  SO4_ship:
    - field: SO4_shp
      operation: add
      scale: 0.077
      scale_fields:
        - EDGAR_TODNOX
  OC:
    - field: OC_agr
      operation: add
      scale: 1.0
      scale_fields:
        - EDGAR_TODNOX
    - field: OC_ind
      operation: add
      scale: 1.0
      scale_fields:
        - EDGAR_TODNOX
    - field: OC_rco
