# Test-suite configuration (see design/design.md).
# application names the adapter (optional; cece is the default) and
# config_path its base driver config; relative paths resolve against this
# file's directory (or ASSAY_CONFIG_SEARCH_PATH when set). Suites live beside
# the configuration they sweep: src/tests/config/<application>/<configuration>/.
# The sweep mirrors the driver-config structure: dimensions attach to named
# streams (or positional species entries); the combination space is the
# cartesian product of all attached value lists. Fields absent from the
# sweep stay at their base-config values.
name: simple-maccity
config_path: maccity.yaml
timeout_s: 10  # per combination; capped by ASSAY_RUN_TIMEOUT_S when that is smaller
# Inputs the base config reads; `uv run ufs-chem-assay fetch --suite-config=<this file>`
# stages them into <CECE_ROOT_DIR>/data (a present file with this sha256 is skipped;
# public: anonymous reads, no AWS credentials needed).
inputs:
  - url: s3://geos-chem/HEMCO/MACCITY/v2014-07/MACCity_4x5.nc
    public: true
    dst: MACCity_4x5.nc
    sha256: ef70975af53499ab45f620a778043ff6fd29ec4e7e2777f3fd1f2db59a12aab9
assertions:
  expected_nc_file_count:  # null = derive from the combo config
  validate_filenames: true
  species:
    co:
      attributes:
        exact: true  # the full attribute dictionary must match; false = subset
        expected:
          # per value: string = exact match; null = must be absent;
          # "__ignore__" = any value allowed
          units: kg m-2 s-1
          long_name: carbon_monoxide_emission_flux
          coordinates: time lev lat lon
# Each entry's sweep_selector mirrors `sweep` with regexes (fullmatch) at the
# leaves and must select exactly one combination; ulids live under
# ASSAY_BASELINE_ROOT_DIR; atol is per entry (default 0.0 = bit-for-bit).
baseline_comparisons:
  - sweep_selector:
      cece_data:
        streams:
          - name: MACCITY
            mapalgo: bilinear
    ulid: 01M4ETZM1Y7Q6RH5Z5AD2Y2BEK
  - sweep_selector:
      cece_data:
        streams:
          - name: MACCITY
            mapalgo: consd
    ulid: 01M4ETZM1Y7Q6RH5Z5AD2Y2BEM
  - sweep_selector:
      cece_data:
        streams:
          - name: MACCITY
            mapalgo: passthrough
    ulid: 01M4ETZM1Y7Q6RH5Z5AD2Y2BEN
analysis:
  compute_descriptive_stats: true  # default; false skips test_descriptive_stats
plotting:
  enabled: true  # default; spatial plots per NetCDF in <combo>/plots/
  gif_enabled: true  # default; per-variable animated GIF from those plots
sweep:
  cece_data:
    streams:
      - name: MACCITY  # selector: which base-config stream; siblings are the swept dimensions
        mapalgo:
          - bilinear
          - consd
          - passthrough
