driver:
  start_time: '2010-01-01T00:00:00'
  end_time: '2010-01-01T03:00:00'
  timestep_seconds: 3600
  grid:
    nx: 72
    ny: 46
    lon_min: -180.0
    lon_max: 180.0
    lat_min: -90.0
    lat_max: 90.0
meteorology: {}
species:
  co:
    - field: co
      operation: add
      scale: 1.0
cece_data:
  streams:
    - name: MACCITY
      file: data/MACCity_4x5.nc  # cwd-relative: the driver runs in the checkout (/work in docker)
      yearFirst: 2000
      yearLast: 2010
      yearAlign: 2020
      taxmode: cycle
      tintalgo: linear
      mapalgo: consd
      variables:
        - file: MACCity
          model: co
diagnostics:
  output_interval_seconds: 3600
  variables:
    - co
output:
  enabled: true
  directory: .
  filename_pattern: cece_{YYYY}{MM}{DD}_{HH}{mm}{ss}.nc
  frequency_steps: 1
  fields:
    - name: co
      attributes:
        units: kg m-2 s-1
        long_name: carbon_monoxide_emission_flux
