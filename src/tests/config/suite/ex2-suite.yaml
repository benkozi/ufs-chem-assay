# Runs CECE's shipped ex2 example as an ordinary suite: regional masking with European focus.
# Select with: --suite-config ex2-suite.yaml (needs CECE_ROOT_DIR or
# --cece-root-dir for the ${CECE_ROOT_DIR} anchor below).
# Prerequisite: example data downloaded into the checkout, e.g.
#   python3 <CECE>/examples/download-example-data.py --example ex2
# No sweep: the example config runs as the single 'base' combination.
name: ex2
config_path: ${CECE_ROOT_DIR}/examples/config/cece_config_ex2.yaml
timeout_s: 300
