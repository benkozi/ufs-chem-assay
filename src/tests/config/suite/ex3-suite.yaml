# Runs CECE's shipped ex3 example as an ordinary suite: simple testing configuration with a minimal grid.
# Select with: --suite-config ex3-suite.yaml (needs CECE_ROOT_DIR or
# --cece-root-dir for the ${CECE_ROOT_DIR} anchor below).
# Prerequisite: example data downloaded into the checkout, e.g.
#   python3 <CECE>/examples/download-example-data.py --example ex3
# No sweep: the example config runs as the single 'base' combination.
name: ex3
config_path: ${CECE_ROOT_DIR}/examples/config/cece_config_ex3.yaml
timeout_s: 300
