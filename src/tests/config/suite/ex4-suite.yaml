# Runs CECE's shipped ex4 example as an ordinary suite: high-resolution HTAPv3 shipping NO regridded to a coarse grid.
# Select with: --suite-config ex4-suite.yaml (needs CECE_ROOT_DIR or
# --cece-root-dir for the ${CECE_ROOT_DIR} anchor below).
# Prerequisite: example data downloaded into the checkout, e.g.
#   python3 <CECE>/examples/download-example-data.py --example ex4
# No sweep: the example config runs as the single 'base' combination.
name: ex4
config_path: ${CECE_ROOT_DIR}/examples/config/cece_config_ex4.yaml
timeout_s: 300
