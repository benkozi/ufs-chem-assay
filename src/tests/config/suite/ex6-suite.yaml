# Runs CECE's shipped ex6 example as an ordinary suite: multi-stream NO emissions.
# Select with: --suite-config ex6-suite.yaml (needs CECE_ROOT_DIR or
# --cece-root-dir for the ${CECE_ROOT_DIR} anchor below).
# Prerequisite: example data downloaded into the checkout, e.g.
#   python3 <CECE>/examples/download-example-data.py --example ex6
# No sweep: the example config runs as the single 'base' combination.
name: ex6
config_path: ${CECE_ROOT_DIR}/examples/config/cece_config_ex6.yaml
timeout_s: 300
